[project]
name = "leibniz-legible"
description = "An open access layer for the digitized Leibniz Nachlass: machine transcription with per-line confidence and provenance, typo-tolerant search, and an IIIF viewer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Leibniz Legible" }]
keywords = ["leibniz", "htr", "iiif", "digital-humanities", "nachlass"]
dynamic = ["version"]

# Runtime dependencies. Kept deliberately small at scaffold time; later phases
# add their own (kraken, fastapi, meilisearch client, etc.) as they land.
dependencies = [
    "typer>=0.12",   # the `leibniz` CLI (one CLI, subcommands per stage)
    "httpx>=0.27",   # polite HTTP for OAI-PMH / IIIF / katalog harvesting
    "lxml>=5.0",     # defensive METS/MODS + manifest parsing
    "rich>=13.7",    # human-readable CLI output / reports
]

[project.scripts]
leibniz = "leibniz.cli:app"

[project.urls]
Repository = "https://github.com/marchofhares/leibnizlegible"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/leibniz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/leibniz"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
